<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Beat Kanji</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* Loading Screen */
        #loading-screen .loading-text {
            font-size: 2rem;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff;
        }

        .loading-bar {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* Menu Screen */
        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00d4ff;
            margin-bottom: 40px;
        }

        .menu-btn {
            background: linear-gradient(135deg, rgba(255,0,255,0.3), rgba(0,212,255,0.3));
            border: 2px solid #00d4ff;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .menu-btn:hover, .menu-btn:active {
            background: linear-gradient(135deg, rgba(255,0,255,0.5), rgba(0,212,255,0.5));
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0,212,255,0.5);
        }

        /* Song Select */
        .song-list {
            width: 90%;
            max-width: 500px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }

        .category-header {
            font-size: 1rem;
            color: #ff00ff;
            margin: 20px 0 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .song-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .song-item:hover, .song-item:active {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .song-info {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Difficulty Select */
        .difficulty-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .difficulty-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid;
            padding: 20px 50px;
            font-size: 1.3rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: white;
        }

        .difficulty-btn.easy { border-color: #00ff88; }
        .difficulty-btn.medium { border-color: #ffaa00; }
        .difficulty-btn.hard { border-color: #ff4444; }
        .difficulty-btn:hover { transform: scale(1.05); }
        .difficulty-btn.easy:hover { background: rgba(0,255,136,0.2); }
        .difficulty-btn.medium:hover { background: rgba(255,170,0,0.2); }
        .difficulty-btn.hard:hover { background: rgba(255,68,68,0.2); }

        /* Game Screen */
        #game-screen { position: relative; }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .lives-display { display: flex; gap: 8px; }

        .heart {
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .heart.alive {
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
        }

        .heart.dead { color: #444; }

        .pause-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
            pointer-events: auto;
        }

        /* Pause Overlay */
        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .pause-overlay.active { display: flex; }
        .pause-title { font-size: 2rem; color: #ff00ff; margin-bottom: 30px; }

        /* Game Over */
        .game-over-title {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 30px #ff00ff;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 3rem;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff;
            margin-bottom: 10px;
        }

        .score-breakdown {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .tier-display { font-size: 4rem; margin-bottom: 30px; }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            z-index: 10;
        }

        .screen-title {
            font-size: 1.8rem;
            color: #00d4ff;
            margin-bottom: 20px;
        }

        /* Progress bar at bottom */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            transition: width 0.1s linear;
        }

        /* Feedback text */
        .feedback {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
        }

        .feedback.perfect { color: #00ff88; text-shadow: 0 0 30px #00ff88; }
        .feedback.good { color: #ffaa00; text-shadow: 0 0 30px #ffaa00; }
        .feedback.miss { color: #ff4444; text-shadow: 0 0 30px #ff4444; }

        .feedback.show {
            animation: feedbackPop 0.6s ease-out forwards;
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }

        /* Settings */
        .settings-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 400px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label { font-size: 1.1rem; }

        .volume-slider {
            width: 150px;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .checkbox-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .checkbox-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .checkbox-item.active {
            background: rgba(0,212,255,0.3);
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading Screen -->
        <div id="loading-screen" class="screen active">
            <div class="loading-text">Loading...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill" id="loading-progress" style="width: 0%"></div>
            </div>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <div class="logo">Beat Kanji</div>
            <div class="subtitle">Learn Kanji with Rhythm</div>
            <button class="menu-btn" onclick="showScreen('song-select-screen')">Play</button>
            <button class="menu-btn" onclick="showScreen('settings-screen')">Settings</button>
        </div>

        <!-- Song Select Screen -->
        <div id="song-select-screen" class="screen">
            <button class="back-btn" onclick="showScreen('menu-screen')">← Back</button>
            <div class="screen-title">Select Song</div>
            <div class="song-list" id="song-list"></div>
        </div>

        <!-- Difficulty Select Screen -->
        <div id="difficulty-screen" class="screen">
            <button class="back-btn" onclick="showScreen('song-select-screen')">← Back</button>
            <div class="screen-title" id="selected-song-title">Song Title</div>
            <div class="difficulty-container">
                <button class="difficulty-btn easy" onclick="startGame('easy')">Easy</button>
                <button class="difficulty-btn medium" onclick="startGame('medium')">Medium</button>
                <button class="difficulty-btn hard" onclick="startGame('hard')">Hard</button>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="screen">
            <button class="back-btn" onclick="showScreen('menu-screen')">← Back</button>
            <div class="screen-title">Settings</div>
            <div class="settings-container">
                <div class="setting-row">
                    <span class="setting-label">Music Volume</span>
                    <input type="range" class="volume-slider" id="music-volume" min="0" max="100" value="70" onchange="updateVolume()">
                </div>
                <div class="setting-row">
                    <span class="setting-label">Show Meaning</span>
                    <button class="checkbox-item" id="show-meaning-toggle" onclick="toggleMeaning()">OFF</button>
                </div>
                <div>
                    <div class="setting-label" style="margin-bottom: 10px;">Kanji Categories</div>
                    <div class="checkbox-container" id="category-checkboxes"></div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <canvas id="game-canvas"></canvas>
            <div class="game-hud">
                <div class="score-display" id="score-display">0</div>
                <div class="lives-display" id="lives-display"></div>
            </div>
            <button class="pause-btn" onclick="togglePause()">⏸</button>
            <div class="feedback" id="feedback"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="pause-overlay" id="pause-overlay">
                <div class="pause-title">Paused</div>
                <button class="menu-btn" onclick="resumeGame()">Resume</button>
                <button class="menu-btn" onclick="quitToMenu()">Quit</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <div class="game-over-title" id="game-over-title">Song Complete!</div>
            <div class="tier-display" id="tier-display">S</div>
            <div class="final-score" id="final-score">10000</div>
            <div class="score-breakdown" id="score-breakdown">100% accuracy</div>
            <button class="menu-btn" onclick="retryGame()">Play Again</button>
            <button class="menu-btn" onclick="showScreen('song-select-screen')">Song Select</button>
            <button class="menu-btn" onclick="showScreen('menu-screen')">Main Menu</button>
        </div>
    </div>

    <script>
        // ===== GAME CONSTANTS =====
        const WINDOW_BEFORE_ARRIVAL = 1.0;  // Time before beat when drawing can start
        const WINDOW_AFTER_ARRIVAL = 1.5;   // Time after beat to complete the stroke
        const FLIGHT_DURATION = 2.0;
        const INTRO_SKIP_TIME = 3.0;
        const GAP_BETWEEN_KANJI_MS = 1500;
        const SPAWN_DEPTH = 10.0;
        const PERSPECTIVE_FACTOR = 0.5;
        const CONVEYOR_HORIZON_Y = 0.35;
        const KANJI_SCALE = 0.75;  // Scale factor for strokes to match font rendering

        // ===== GAME STATE =====
        let kanjiData = [];
        let beatmaps = {};
        let categories = [];
        let selectedSong = null;
        let selectedBeatmap = null;

        let settings = {
            musicVolume: 0.7,
            showMeaning: false,
            enabledCategories: new Set(['n5', 'n4', 'n3', 'hiragana', 'katakana'])
        };

        let gameState = {
            score: 0,
            lives: 4,
            maxLives: 4,
            currentKanji: null,
            currentKanjiIndex: 0,
            currentStrokeIndex: 0,
            kanjiSequence: [],
            beatEvents: [],
            currentBeatEventIndex: 0,
            isPaused: false,
            isPlaying: false,
            startTime: 0,
            pauseTime: 0,
            totalPausedTime: 0,
            difficulty: 'easy',
            drawnPoints: [],
            isDrawing: false,
            isDrawingInWindow: false,
            completedStrokes: [],
            flyingStrokes: [],
            conveyorLines: [],
            nextConveyorSpawnTime: 0,
            nextSpawnIndex: 0
        };

        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let gainNode = null;
        let menuAudio = null;
        let canvas, ctx;
        let animationId = null;

        // ===== INITIALIZATION =====
        async function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            loadSettings();

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            gainNode.gain.value = settings.musicVolume;

            await loadGameData();
            setupInputHandlers();
            showScreen('menu-screen');
            playMenuMusic();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        async function loadGameData() {
            const progressBar = document.getElementById('loading-progress');
            progressBar.style.width = '20%';

            const kanjiResponse = await fetch('kanji-data.json');
            kanjiData = await kanjiResponse.json();
            progressBar.style.width = '40%';

            const catResponse = await fetch('data/categories.json');
            categories = await catResponse.json();

            const beatmapFiles = [
                'adagio-for-strings', 'canon-in-d', 'clair-de-lune',
                'digital-heartbeat', 'hungarian-rhapsody-no-2', 'moonlight-sonate',
                'odoriakasou', 'sanninnokohi', 'the-blue-danube', 'wakamarunohune'
            ];

            for (let i = 0; i < beatmapFiles.length; i++) {
                try {
                    const response = await fetch(`data/${beatmapFiles[i]}.json`);
                    beatmaps[beatmapFiles[i]] = await response.json();
                } catch (e) {}
                progressBar.style.width = `${40 + (i + 1) / beatmapFiles.length * 50}%`;
            }

            progressBar.style.width = '100%';
            populateSongList();
            setupSettingsUI();
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('beatkanji-settings');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    settings.musicVolume = parsed.musicVolume ?? 0.7;
                    settings.showMeaning = parsed.showMeaning ?? false;
                    if (parsed.enabledCategories) settings.enabledCategories = new Set(parsed.enabledCategories);
                }
            } catch (e) {}
        }

        function saveSettings() {
            localStorage.setItem('beatkanji-settings', JSON.stringify({
                musicVolume: settings.musicVolume,
                showMeaning: settings.showMeaning,
                enabledCategories: Array.from(settings.enabledCategories)
            }));
        }

        // ===== UI =====
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'menu-screen') playMenuMusic();
        }

        function populateSongList() {
            const songList = document.getElementById('song-list');
            songList.innerHTML = '';

            const songsByCategory = {};
            for (const [name, beatmap] of Object.entries(beatmaps)) {
                const category = beatmap.meta.category || 'Uncategorized';
                if (!songsByCategory[category]) songsByCategory[category] = [];
                songsByCategory[category].push({ name, beatmap });
            }

            const orderedCategories = categories.map(c => c.name);
            const allCategories = [...new Set([...orderedCategories, ...Object.keys(songsByCategory)])];

            for (const category of allCategories) {
                const songs = songsByCategory[category];
                if (!songs?.length) continue;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = category;
                songList.appendChild(header);

                for (const { name, beatmap } of songs) {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `<div class="song-title">${beatmap.meta.title || name}</div>
                        <div class="song-info">${beatmap.meta.bpm} BPM · ${Math.floor(beatmap.meta.total_duration / 60)}:${String(Math.floor(beatmap.meta.total_duration % 60)).padStart(2, '0')}</div>`;
                    item.onclick = () => { selectedSong = name; selectedBeatmap = beatmap; document.getElementById('selected-song-title').textContent = beatmap.meta.title || name; showScreen('difficulty-screen'); };
                    songList.appendChild(item);
                }
            }
        }

        function setupSettingsUI() {
            document.getElementById('music-volume').value = settings.musicVolume * 100;
            document.getElementById('show-meaning-toggle').textContent = settings.showMeaning ? 'ON' : 'OFF';
            document.getElementById('show-meaning-toggle').classList.toggle('active', settings.showMeaning);

            const container = document.getElementById('category-checkboxes');
            container.innerHTML = '';
            const cats = ['n5', 'n4', 'n3', 'n2', 'n1', 'hiragana', 'katakana'];
            const labels = { n5: 'N5', n4: 'N4', n3: 'N3', n2: 'N2', n1: 'N1', hiragana: 'Hiragana', katakana: 'Katakana' };

            for (const cat of cats) {
                const item = document.createElement('button');
                item.className = 'checkbox-item' + (settings.enabledCategories.has(cat) ? ' active' : '');
                item.textContent = labels[cat];
                item.onclick = () => {
                    settings.enabledCategories.has(cat) ? settings.enabledCategories.delete(cat) : settings.enabledCategories.add(cat);
                    item.classList.toggle('active');
                    saveSettings();
                };
                container.appendChild(item);
            }
        }

        function updateVolume() {
            settings.musicVolume = document.getElementById('music-volume').value / 100;
            if (gainNode) gainNode.gain.value = settings.musicVolume;
            if (menuAudio) menuAudio.volume = settings.musicVolume;
            saveSettings();
        }

        function toggleMeaning() {
            settings.showMeaning = !settings.showMeaning;
            document.getElementById('show-meaning-toggle').textContent = settings.showMeaning ? 'ON' : 'OFF';
            document.getElementById('show-meaning-toggle').classList.toggle('active', settings.showMeaning);
            saveSettings();
        }

        // ===== AUDIO =====
        function playMenuMusic() {
            if (menuAudio) { menuAudio.play().catch(() => {}); return; }
            menuAudio = new Audio('audio/menu.mp3');
            menuAudio.loop = true;
            menuAudio.volume = settings.musicVolume;
            menuAudio.play().catch(() => {});
        }

        function stopMenuMusic() { if (menuAudio) { menuAudio.pause(); menuAudio.currentTime = 0; } }

        async function loadSongAudio(filename) {
            const response = await fetch(`audio/${filename}`);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        }

        function playSong() {
            if (audioContext.state === 'suspended') audioContext.resume();
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(gainNode);
            audioSource.start(0);
            gameState.startTime = audioContext.currentTime;
            audioSource.onended = () => { if (gameState.isPlaying && !gameState.isPaused) endGame(true); };
        }

        function stopSong() { if (audioSource) { try { audioSource.stop(); } catch (e) {} audioSource = null; } }

        function getCurrentTime() {
            if (!gameState.isPlaying) return 0;
            if (gameState.isPaused) return gameState.pauseTime - gameState.startTime - gameState.totalPausedTime;
            return audioContext.currentTime - gameState.startTime - gameState.totalPausedTime;
        }

        // ===== GAME =====
        async function startGame(difficulty) {
            stopMenuMusic();

            gameState = {
                score: 0, lives: 4, maxLives: 4, currentKanji: null, currentKanjiIndex: 0, currentStrokeIndex: 0,
                kanjiSequence: [], beatEvents: [], currentBeatEventIndex: 0, isPaused: false, isPlaying: true,
                startTime: 0, pauseTime: 0, totalPausedTime: 0, difficulty, drawnPoints: [], isDrawing: false,
                isDrawingInWindow: false, completedStrokes: [], flyingStrokes: [], conveyorLines: [],
                nextConveyorSpawnTime: 0, nextSpawnIndex: 0
            };

            const filteredKanji = kanjiData.filter(k => k.tags.some(t => settings.enabledCategories.has(t))).map(k => ({
                id: k.id, char: k.c, strokeCount: k.sc, keyword: k.kw, tags: k.tags,
                strokes: k.strokes.map(s => ({ id: s.id, points: s.points, lengthClass: s.lc }))
            }));

            if (!filteredKanji.length) { alert('No kanji available!'); showScreen('settings-screen'); return; }

            let notes = selectedBeatmap.notes.filter(n => {
                if (difficulty === 'easy') return n.level === 1;
                if (difficulty === 'medium') return n.level <= 2;
                return n.level <= 3;
            }).filter(n => n.time >= INTRO_SKIP_TIME);

            const result = selectKanjiWithGaps(filteredKanji, notes, GAP_BETWEEN_KANJI_MS);
            gameState.kanjiSequence = result.kanji;
            gameState.beatEvents = createBeatEvents(result.notes);

            showScreen('game-screen');
            await loadSongAudio(selectedBeatmap.meta.filename);
            loadNextKanji();
            updateHUD();
            playSong();
            gameLoop();
        }

        function selectKanjiWithGaps(kanjiList, notes, gapMs) {
            const gapSeconds = gapMs / 1000;
            const selectedKanji = [], usedNotes = [];
            let availableNotes = [...notes], shuffledKanji = shuffle([...kanjiList]), shuffleIndex = 0;

            while (availableNotes.length > 0) {
                if (shuffleIndex >= shuffledKanji.length) { shuffledKanji = shuffle([...kanjiList]); shuffleIndex = 0; }
                const kanji = shuffledKanji[shuffleIndex];
                if (kanji.strokeCount <= availableNotes.length) {
                    const kanjiNotes = availableNotes.slice(0, kanji.strokeCount);
                    usedNotes.push(...kanjiNotes);
                    selectedKanji.push(kanji);
                    availableNotes = availableNotes.slice(kanji.strokeCount);
                    if (kanjiNotes.length && availableNotes.length) {
                        const lastTime = kanjiNotes[kanjiNotes.length - 1].time;
                        availableNotes = availableNotes.filter(n => n.time > lastTime + gapSeconds);
                    }
                } else {
                    const smaller = shuffledKanji.find(k => k.strokeCount <= availableNotes.length);
                    if (smaller) { shuffledKanji = shuffledKanji.filter(k => k.id !== smaller.id); shuffledKanji.splice(shuffleIndex, 0, smaller); continue; }
                    break;
                }
                shuffleIndex++;
            }
            return { kanji: selectedKanji, notes: usedNotes };
        }

        function createBeatEvents(notes) {
            const events = [];
            let kanjiIdx = 0, strokeIdx = 0;
            for (const note of notes) {
                if (kanjiIdx < gameState.kanjiSequence.length && strokeIdx >= gameState.kanjiSequence[kanjiIdx].strokeCount) { kanjiIdx++; strokeIdx = 0; }
                if (kanjiIdx >= gameState.kanjiSequence.length) break;
                events.push({ beatTime: note.time, kanjiIndex: kanjiIdx, strokeIndex: strokeIdx, isRainbow: Math.random() < 0.05 });
                strokeIdx++;
            }
            return events;
        }

        function loadNextKanji() {
            if (gameState.currentKanjiIndex >= gameState.kanjiSequence.length) { gameState.currentKanji = null; return; }
            gameState.currentKanji = gameState.kanjiSequence[gameState.currentKanjiIndex];
            gameState.currentStrokeIndex = 0;
            gameState.completedStrokes = [];
            gameState.nextSpawnIndex = 0;
        }

        function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

        // ===== INPUT =====
        function setupInputHandlers() {
            canvas.addEventListener('mousedown', handlePointerStart);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('mouseup', handlePointerEnd);
            canvas.addEventListener('mouseleave', handlePointerEnd);
            canvas.addEventListener('touchstart', e => { e.preventDefault(); handlePointerStart(e.touches[0]); });
            canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePointerMove(e.touches[0]); });
            canvas.addEventListener('touchend', e => { e.preventDefault(); handlePointerEnd(); });
        }

        function handlePointerStart(e) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;

            const windowState = isStrokeWindowActive();
            if (!windowState.isActive) {
                // Show too early feedback
                ctx.save();
                ctx.fillStyle = 'rgba(255, 68, 68, 0.8)';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Too early!', x, y - 20);
                ctx.restore();
                return;
            }

            gameState.isDrawing = true;
            gameState.isDrawingInWindow = true;
            gameState.drawnPoints = [{ x, y }];
        }

        function handlePointerMove(e) {
            if (!gameState.isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            gameState.drawnPoints.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
        }

        function handlePointerEnd() {
            if (!gameState.isDrawing) return;
            gameState.isDrawing = false;
            if (gameState.isDrawingInWindow && gameState.drawnPoints.length >= 3) evaluateCurrentStroke();
            gameState.isDrawingInWindow = false;
            gameState.drawnPoints = [];
        }

        function isStrokeWindowActive() {
            const event = gameState.beatEvents[gameState.currentBeatEventIndex];
            if (!event) return { isActive: false, progress: 0 };
            const currentTime = getCurrentTime();
            const arrivalTime = event.beatTime;
            const windowStart = arrivalTime - WINDOW_BEFORE_ARRIVAL;
            const extraTime = getExtraTime();
            const windowEnd = arrivalTime + WINDOW_AFTER_ARRIVAL + extraTime;
            return { isActive: currentTime >= windowStart && currentTime <= windowEnd, progress: Math.max(0, Math.min(1, (currentTime - windowStart) / (windowEnd - windowStart))) };
        }

        function getExtraTime() {
            if (!gameState.currentKanji) return 0;
            const stroke = gameState.currentKanji.strokes[gameState.currentStrokeIndex];
            return stroke ? ({ S: 0, M: 0.25, L: 0.5, XL: 0.75 }[stroke.lengthClass] || 0) : 0;
        }

        function evaluateCurrentStroke() {
            if (!gameState.currentKanji || gameState.currentStrokeIndex >= gameState.currentKanji.strokeCount) return;

            const targetStroke = gameState.currentKanji.strokes[gameState.currentStrokeIndex];
            const kanjiArea = getKanjiArea();

            // Calculate the scaled stroke area (matching where strokes are drawn)
            const scaledSize = kanjiArea.size * KANJI_SCALE;
            const offset = (kanjiArea.size - scaledSize) / 2;
            const strokeAreaX = kanjiArea.x + offset;
            const strokeAreaY = kanjiArea.y + offset;

            const normalizedDrawn = gameState.drawnPoints.map(p => ({ x: (p.x - strokeAreaX) / scaledSize, y: (p.y - strokeAreaY) / scaledSize }));
            const result = evaluateStroke(normalizedDrawn, targetStroke);
            const event = gameState.beatEvents[gameState.currentBeatEventIndex];

            if (result === 'perfect') {
                gameState.score += 100;
                showFeedback('PERFECT!', 'perfect');
                if (event?.isRainbow && gameState.lives < gameState.maxLives) gameState.lives++;
                gameState.completedStrokes.push({ index: gameState.currentStrokeIndex, result: 'perfect' });
            } else if (result === 'good') {
                gameState.score += 30;
                showFeedback('Good', 'good');
                gameState.completedStrokes.push({ index: gameState.currentStrokeIndex, result: 'good' });
            } else {
                showFeedback('Miss', 'miss');
                loseLife();
                gameState.completedStrokes.push({ index: gameState.currentStrokeIndex, result: 'miss' });
            }

            advanceStroke();
            updateHUD();
        }

        function evaluateStroke(drawnPoints, targetStroke) {
            const sampleCount = 50;
            const targetPoints = targetStroke.points.map(p => ({ x: p[0], y: p[1] }));
            const resampledDrawn = resamplePoints(drawnPoints, sampleCount);
            const resampledTarget = resamplePoints(targetPoints, sampleCount);

            let totalDist = 0;
            for (let i = 0; i < sampleCount; i++) {
                totalDist += Math.hypot(resampledDrawn[i].x - resampledTarget[i].x, resampledDrawn[i].y - resampledTarget[i].y);
            }
            const avgDist = totalDist / sampleCount;
            if (avgDist < 0.06) return 'perfect';
            if (avgDist < 0.12) return 'good';
            return 'miss';
        }

        function resamplePoints(points, count) {
            if (points.length < 2) return Array(count).fill(points[0] || { x: 0, y: 0 });
            let totalLength = 0;
            for (let i = 0; i < points.length - 1; i++) totalLength += Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
            const interval = totalLength / (count - 1);
            const result = [points[0]];
            let currentDist = 0, nextDist = interval, i = 0;
            while (result.length < count) {
                if (i >= points.length - 1) { result.push(points[points.length - 1]); continue; }
                const dx = points[i + 1].x - points[i].x, dy = points[i + 1].y - points[i].y;
                const segLen = Math.sqrt(dx * dx + dy * dy);
                if (currentDist + segLen >= nextDist) {
                    const t = (nextDist - currentDist) / segLen;
                    result.push({ x: points[i].x + dx * t, y: points[i].y + dy * t });
                    nextDist += interval;
                } else { currentDist += segLen; i++; }
            }
            return result;
        }

        function advanceStroke() {
            gameState.currentStrokeIndex++;
            gameState.currentBeatEventIndex++;
            gameState.flyingStrokes = gameState.flyingStrokes.filter(fs => !(fs.kanjiIndex === gameState.currentKanjiIndex && fs.strokeIndex < gameState.currentStrokeIndex));
            if (gameState.currentKanji && gameState.currentStrokeIndex >= gameState.currentKanji.strokeCount) { gameState.currentKanjiIndex++; loadNextKanji(); }
        }

        function loseLife() { gameState.lives--; if (gameState.lives <= 0) endGame(false); }

        function showFeedback(text, type) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = text;
            feedback.className = 'feedback ' + type + ' show';
            setTimeout(() => feedback.classList.remove('show'), 600);
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = gameState.score;
            const livesDisplay = document.getElementById('lives-display');
            livesDisplay.innerHTML = '';
            for (let i = 0; i < gameState.maxLives; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart ' + (i < gameState.lives ? 'alive' : 'dead');
                heart.textContent = '♥';
                livesDisplay.appendChild(heart);
            }
        }

        // ===== GAME LOOP =====
        function gameLoop() {
            if (!gameState.isPlaying) return;
            if (!gameState.isPaused) { update(); render(); }
            animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            const currentTime = getCurrentTime();
            document.getElementById('progress-fill').style.width = `${Math.min(100, (currentTime / selectedBeatmap.meta.total_duration) * 100)}%`;

            spawnFlyingStrokes(currentTime);
            updateFlyingStrokes(currentTime);
            updateConveyorBelt(currentTime);

            // Timeout check
            if (gameState.currentKanji && !gameState.isDrawing) {
                const event = gameState.beatEvents[gameState.currentBeatEventIndex];
                if (event && currentTime > event.beatTime + WINDOW_AFTER_ARRIVAL + getExtraTime()) {
                    showFeedback('Miss', 'miss');
                    loseLife();
                    gameState.completedStrokes.push({ index: gameState.currentStrokeIndex, result: 'miss' });
                    advanceStroke();
                    updateHUD();
                }
            }
        }

        function spawnFlyingStrokes(currentTime) {
            if (!gameState.currentKanji) return;
            while (gameState.nextSpawnIndex < gameState.currentKanji.strokes.length) {
                const globalIdx = gameState.currentBeatEventIndex + (gameState.nextSpawnIndex - gameState.currentStrokeIndex);
                if (globalIdx >= gameState.beatEvents.length) break;
                const event = gameState.beatEvents[globalIdx];
                if (event.kanjiIndex !== gameState.currentKanjiIndex) break;
                if (event.beatTime - currentTime <= FLIGHT_DURATION) {
                    gameState.flyingStrokes.push({ kanjiIndex: event.kanjiIndex, strokeIndex: event.strokeIndex, arrivalTime: event.beatTime, isRainbow: event.isRainbow, stroke: gameState.currentKanji.strokes[event.strokeIndex] });
                    gameState.nextSpawnIndex++;
                } else break;
            }
        }

        function updateFlyingStrokes(currentTime) {
            gameState.flyingStrokes = gameState.flyingStrokes.filter(fs => fs.arrivalTime - currentTime > -0.5);
        }

        function updateConveyorBelt(currentTime) {
            const interval = 60 / selectedBeatmap.meta.bpm;
            if (currentTime >= gameState.nextConveyorSpawnTime) {
                gameState.conveyorLines.push({ spawnTime: currentTime });
                gameState.nextConveyorSpawnTime = currentTime + interval;
            }
            gameState.conveyorLines = gameState.conveyorLines.filter(l => currentTime - l.spawnTime < FLIGHT_DURATION);
        }

        // ===== RENDER =====
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentTime = getCurrentTime();
            const centerX = canvas.width / 2, centerY = canvas.height / 2;

            // Background
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(canvas.width, canvas.height));
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#0f0f1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Perspective rails - converging lines from bottom corners to horizon
            const horizonY = canvas.height * CONVEYOR_HORIZON_Y;
            const kanjiArea = getKanjiArea();
            const floorY = kanjiArea.y + kanjiArea.size;

            // Draw converging perspective rails
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            // Left rail
            ctx.moveTo(0, floorY);
            ctx.lineTo(centerX, horizonY);
            // Right rail
            ctx.moveTo(canvas.width, floorY);
            ctx.lineTo(centerX, horizonY);
            ctx.stroke();

            // Horizon glow
            const horizonGrad = ctx.createLinearGradient(0, horizonY - 20, 0, horizonY + 20);
            horizonGrad.addColorStop(0, 'rgba(0, 212, 255, 0)');
            horizonGrad.addColorStop(0.5, 'rgba(0, 212, 255, 0.1)');
            horizonGrad.addColorStop(1, 'rgba(0, 212, 255, 0)');
            ctx.fillStyle = horizonGrad;
            ctx.fillRect(0, horizonY - 20, canvas.width, 40);

            // Conveyor belt - lines fly from horizon toward bottom of screen
            for (const line of gameState.conveyorLines) {
                const progress = (currentTime - line.spawnTime) / FLIGHT_DURATION;
                if (progress < 0 || progress > 1) continue;
                const depth = SPAWN_DEPTH * (1 - progress);
                const scale = 1 / (1 + depth * PERSPECTIVE_FACTOR);
                // Interpolate Y from horizon to floor as progress increases
                const y = horizonY + (floorY - horizonY) * progress;
                const halfWidth = canvas.width * 0.5 * scale;
                ctx.strokeStyle = `rgba(0, 212, 255, ${0.1 + 0.5 * scale})`;
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                ctx.moveTo(centerX - halfWidth, y);
                ctx.lineTo(centerX + halfWidth, y);
                ctx.stroke();
            }

            // Kanji area
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            roundRect(ctx, kanjiArea.x, kanjiArea.y, kanjiArea.size, kanjiArea.size, 15);
            ctx.fill();
            ctx.stroke();

            if (gameState.currentKanji) {
                // Kanji char - draw at same scale as strokes
                ctx.font = `${kanjiArea.size * KANJI_SCALE}px 'Noto Sans JP'`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(gameState.currentKanji.char, kanjiArea.x + kanjiArea.size / 2, kanjiArea.y + kanjiArea.size / 2);

                if (settings.showMeaning && gameState.currentKanji.keyword) {
                    ctx.font = '18px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fillText(gameState.currentKanji.keyword, kanjiArea.x + kanjiArea.size / 2, kanjiArea.y + kanjiArea.size + 30);
                }

                // Completed strokes
                for (const c of gameState.completedStrokes) {
                    const stroke = gameState.currentKanji.strokes[c.index];
                    if (stroke) drawStroke(stroke, kanjiArea, c.result === 'perfect' ? '#00ff88' : c.result === 'good' ? '#ffaa00' : '#ff4444', 0.5, 4);
                }

                // Flying strokes
                for (const fs of gameState.flyingStrokes) {
                    if (fs.kanjiIndex !== gameState.currentKanjiIndex) continue;
                    const timeUntilArrival = fs.arrivalTime - currentTime;
                    const progress = Math.max(0, timeUntilArrival / FLIGHT_DURATION);
                    const depth = progress * SPAWN_DEPTH;
                    const fillPercent = 1 - progress;
                    const alpha = Math.min(1, (1 - progress) * 1.5);
                    const color = fs.isRainbow && gameState.lives < gameState.maxLives ? '#ff00ff' : '#00d4ff';
                    drawStrokeWithPerspective(fs.stroke, kanjiArea, centerX, centerY, depth, color, alpha * 0.2, 3, 1.0);
                    drawStrokeWithPerspective(fs.stroke, kanjiArea, centerX, centerY, depth, color, alpha * 0.9, 5, fillPercent);
                }

                // Current stroke
                const currentStroke = gameState.currentKanji.strokes[gameState.currentStrokeIndex];
                if (currentStroke && !gameState.flyingStrokes.some(fs => fs.kanjiIndex === gameState.currentKanjiIndex && fs.strokeIndex === gameState.currentStrokeIndex)) {
                    const windowState = isStrokeWindowActive();
                    const event = gameState.beatEvents[gameState.currentBeatEventIndex];
                    const isRainbow = event?.isRainbow && gameState.lives < gameState.maxLives;
                    drawStroke(currentStroke, kanjiArea, isRainbow ? '#ff00ff' : '#00d4ff', windowState.isActive ? 1.0 : 0.6, 6, windowState.isActive ? 15 : 0);
                }
            }

            // User stroke
            if (gameState.isDrawing && gameState.drawnPoints.length > 1) {
                ctx.save();
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = 15;
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                gameState.drawnPoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawStroke(stroke, kanjiArea, color, alpha, lineWidth, glow = 0) {
            const points = stroke.points;
            if (points.length < 2) return;

            // Calculate scaled and centered stroke area to match font rendering
            const scaledSize = kanjiArea.size * KANJI_SCALE;
            const offset = (kanjiArea.size - scaledSize) / 2;
            const strokeAreaX = kanjiArea.x + offset;
            const strokeAreaY = kanjiArea.y + offset;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
            ctx.beginPath();
            points.forEach((p, i) => {
                const x = strokeAreaX + p[0] * scaledSize;
                const y = strokeAreaY + p[1] * scaledSize;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.restore();
        }

        function drawStrokeWithPerspective(stroke, kanjiArea, centerX, centerY, depth, color, alpha, lineWidth, fillPercent) {
            const points = stroke.points;
            if (points.length < 2) return;

            // Calculate scale based on depth (distant = small, close = full size)
            const scale = 1 / (1 + depth * PERSPECTIVE_FACTOR);

            // Calculate the horizon position where strokes spawn (center of screen, slightly above)
            const horizonY = canvas.height * CONVEYOR_HORIZON_Y;

            // Progress from horizon to kanji box (0 = at horizon, 1 = at kanji box)
            const flyProgress = 1 - (depth / SPAWN_DEPTH);

            // Calculate the current center position of the stroke
            // Start at screen center (horizon), end at kanji box center
            const kanjiCenterX = kanjiArea.x + kanjiArea.size / 2;
            const kanjiCenterY = kanjiArea.y + kanjiArea.size / 2;
            const currentCenterX = centerX + (kanjiCenterX - centerX) * flyProgress;
            const currentCenterY = horizonY + (kanjiCenterY - horizonY) * flyProgress;

            // Current size of the stroke area at this depth (scaled to match font)
            const currentSize = kanjiArea.size * KANJI_SCALE * scale;

            const pointsToDraw = Math.max(2, Math.ceil(points.length * fillPercent));
            ctx.save();
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = lineWidth * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 10 * scale;
            ctx.beginPath();
            for (let i = 0; i < pointsToDraw; i++) {
                // Calculate position relative to current flying center
                const normalizedX = points[i][0] - 0.5; // -0.5 to 0.5
                const normalizedY = points[i][1] - 0.5; // -0.5 to 0.5
                const px = currentCenterX + normalizedX * currentSize;
                const py = currentCenterY + normalizedY * currentSize;
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        function getKanjiArea() {
            const size = Math.min(canvas.width * 0.6, canvas.height * 0.4, 350);
            return { x: (canvas.width - size) / 2, y: canvas.height - size - canvas.height * 0.08, size };
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
        }

        // ===== CONTROLS =====
        function togglePause() {
            if (gameState.isPaused) resumeGame();
            else { gameState.isPaused = true; gameState.pauseTime = audioContext.currentTime; document.getElementById('pause-overlay').classList.add('active'); audioContext.suspend(); }
        }

        function resumeGame() {
            gameState.totalPausedTime += audioContext.currentTime - gameState.pauseTime;
            gameState.isPaused = false;
            document.getElementById('pause-overlay').classList.remove('active');
            audioContext.resume();
        }

        function quitToMenu() {
            gameState.isPlaying = false;
            gameState.isPaused = false;
            document.getElementById('pause-overlay').classList.remove('active');
            stopSong();
            if (animationId) cancelAnimationFrame(animationId);
            showScreen('menu-screen');
        }

        function endGame(completed) {
            gameState.isPlaying = false;
            stopSong();
            if (animationId) cancelAnimationFrame(animationId);

            const maxScore = gameState.beatEvents.length * 100;
            const percentage = maxScore > 0 ? Math.round((gameState.score / maxScore) * 100) : 0;
            let tier = percentage >= 95 ? 'S' : percentage >= 85 ? 'A' : percentage >= 70 ? 'B' : percentage >= 50 ? 'C' : 'D';
            const tierColors = { S: '#ffd700', A: '#00ff88', B: '#00d4ff', C: '#ffaa00', D: '#ff4444' };

            document.getElementById('game-over-title').textContent = completed ? 'Song Complete!' : 'Game Over';
            document.getElementById('tier-display').textContent = tier;
            document.getElementById('tier-display').style.color = tierColors[tier];
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('score-breakdown').textContent = `${percentage}% accuracy`;
            showScreen('game-over-screen');
        }

        function retryGame() { startGame(gameState.difficulty); }

        window.addEventListener('load', init);
        document.addEventListener('visibilitychange', () => { if (document.hidden && gameState.isPlaying && !gameState.isPaused) togglePause(); });
    </script>
</body>
</html>
